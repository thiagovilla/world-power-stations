name: WPS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend (Spring Boot / Java 21) Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x apps/backend/gradlew

      - name: Run Backend Tests
        run: cd apps/backend && ./gradlew test

      - name: Build Backend Jar
        run: cd apps/backend && ./gradlew bootJar

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: apps/backend/build/reports/tests/test/

  frontend-test:
    name: Frontend (Remix / Node 22) Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/frontend/package.json

      - name: Install Frontend Dependencies
        run: cd apps/frontend && npm ci

      - name: Run Typecheck
        run: cd apps/frontend && npm run typecheck

      - name: Run Frontend Tests
        run: cd apps/frontend && npm test

      - name: Build Frontend Application
        run: cd apps/frontend && npm run build

  docker-build:
    name: Docker Containers Build Verification
    needs: [ backend-test, frontend-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          tags: world-power-stations-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: false
          tags: world-power-stations-frontend:ci
