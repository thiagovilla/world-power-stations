services:
  backend:
    image: ${ECR_REGISTRY:-world-power-stations}/${BACKEND_IMAGE:-wps-backend}:${IMAGE_TAG:-latest}
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: wps-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms192m -Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1}"
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/world_power_stations}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-postgres}"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      S3_BUCKET_NAME: "${S3_BUCKET_NAME:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 400M

  frontend:
    image: ${ECR_REGISTRY:-world-power-stations}/${FRONTEND_IMAGE:-wps-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: wps-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_INTERNAL_URL: "http://backend:8080"
      BACKEND_URL: "${BACKEND_URL:-http://backend:8080}"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300M

  gateway:
    image: nginx:1.27-alpine
    container_name: wps-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
